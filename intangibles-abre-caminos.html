<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atributos intangibles | Nu Abre Caminos</title>
<style>
:root{--p:#820AD1;--w:#fff;--card:rgba(255,255,255,.14);--bd:rgba(255,255,255,.6);--fs:16px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--p);color:var(--w);font-family:"Poppins","Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.55}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--p);border-bottom:1px solid var(--bd);display:flex;gap:6px;align-items:center;padding:10px 14px}
nav b{font-size:1.5rem;font-weight:800;margin-right:8px}
button{font:inherit;color:var(--w);background:transparent;border:1px solid var(--bd);border-radius:999px;padding:6px 16px;cursor:pointer;font-size:.9rem}
button:hover,button.on{background:var(--w);color:var(--p)}
.zoom{margin-left:auto;display:flex;gap:6px}
main{max-width:1000px;margin:0 auto;padding:46px 20px 20px}
.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:.78rem;font-weight:600;margin-bottom:6px}
h1{font-size:clamp(2.2rem,6.5vw,4rem);margin:0;line-height:1.05;font-weight:800}
.sub{max-width:62ch;margin:12px 0 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px}
.tabs button{font-size:1rem;padding:8px 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:6px}
.tag{align-self:flex-start;border:1px solid var(--bd);border-radius:999px;padding:2px 12px;font-size:.75rem;text-transform:uppercase;letter-spacing:.1em}
.card h2{margin:4px 0 0;font-size:1.4rem}
.card p{margin:0}
footer{max-width:1000px;margin:40px auto 0;padding:18px 20px 40px;border-top:1px solid var(--bd);font-size:.85rem}
footer a{color:var(--w);word-break:break-all}
</style>
</head>
<body>
<nav><b>nu</b><div class="zoom"><button id="zo" aria-label="Reducir texto">A−</button><button id="zi" aria-label="Aumentar texto">A+</button></div></nav>
<main>
<div class="eyebrow">Nu Abre Caminos</div>
<h1>Atributos intangibles</h1>
<p class="sub">Siete atributos agrupados en tres categorías: funcional, identificativa y social.</p>
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
</main>
<footer>Fuente: <a href="https://blog.nu.com.co/tarjeta-abre-caminos-nu/">https://blog.nu.com.co/tarjeta-abre-caminos-nu/</a></footer>
<script>
const A=[
["Funcional","Finalidad","Construir o reconstruir el historial crediticio mediante el uso responsable de una tarjeta de crédito. Está dirigido a personas que buscan iniciar una trayectoria crediticia o mejorar un historial existente."],
["Funcional","Función","Facilitar el acceso a una línea de crédito cuyo cupo inicial se encuentra respaldado por el dinero depositado por el titular en la Cajita de Respaldo. El monto depositado determina inicialmente el cupo disponible; por ejemplo, un depósito de $100.000 genera inicialmente un cupo de $100.000."],
["Funcional","Flexibilidad","Permitir que el titular determine inicialmente el monto que desea depositar como respaldo de su cupo y utilizar la tarjeta para realizar compras a una o varias cuotas."],
["Funcional","Tiempo","Permitir la construcción progresiva de un historial crediticio a través del comportamiento de uso y pago de la tarjeta. La trayectoria generada durante el tiempo de utilización puede contribuir al acceso posterior a nuevas oportunidades de crédito."],
["Funcional","Fiabilidad","Incorporar la Cajita de Respaldo como mecanismo asociado a la obligación crediticia. En posibles situaciones de impago, el dinero disponible en esta cuenta puede utilizarse para cubrir la obligación, de acuerdo con las condiciones del producto."],
["Identificativo","Marketing","El concepto “Abre Caminos” representa la propuesta de acompañar al titular en la construcción o reconstrucción de su historial crediticio y asociar el producto con el acceso a futuras oportunidades financieras."],
["Social","Responsabilidades","Vincular el uso del producto con la educación sobre el manejo responsable del crédito, especialmente mediante el cumplimiento de los pagos y el desarrollo de hábitos financieros que contribuyan a construir un historial crediticio. Nu también plantea misiones para acompañar el proceso de uso de la tarjeta."]
];
const $=s=>document.querySelector(s);
function show(c){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.c===c));
  $("#grid").innerHTML="";
  A.filter(a=>c==="Todos"||a[0]===c).forEach(([cat,n,d])=>{
    const e=document.createElement("div");e.className="card";
    const t=document.createElement("span");t.className="tag";t.textContent=cat;
    const h=document.createElement("h2");h.textContent=n;
    const p=document.createElement("p");p.textContent=d;
    e.append(t,h,p);$("#grid").appendChild(e);
  });
}
["Todos","Funcional","Identificativo","Social"].forEach(c=>{
  const b=document.createElement("button");b.dataset.c=c;
  b.textContent=c==="Todos"?"Todos (7)":c+" ("+A.filter(a=>a[0]===c).length+")";
  b.onclick=()=>show(c);$("#tabs").appendChild(b);
});
show("Todos");
let fs=16;const setFs=v=>{fs=Math.min(26,Math.max(12,v));document.documentElement.style.setProperty("--fs",fs+"px")};
$("#zi").onclick=()=>setFs(fs+2);$("#zo").onclick=()=>setFs(fs-2);
</script>
</body>
</html>
